[project]
name = "mt5copier"
version = "0.1.0"
description = "MT5 multi-terminal trade copier (Stage 1: discovery & designation)"
requires-python = ">=3.13"
dependencies = [
    "metatrader5>=5.0.6180; sys_platform == 'win32'",
    "pydantic>=2.9",
    "psutil>=7.0",
    "textual>=1.0",
]

[project.scripts]
mt5copier = "mt5copier.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=5.0",
    "pyinstaller>=6.11",
    "ruff>=0.14",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
