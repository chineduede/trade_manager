# A pushed release tag becomes a GitHub Release with the installer attached.
#
# The local pipeline (scripts\release.ps1) stays the source of truth: it gates, bumps,
# tags, builds and shelves locally, then pushes master and the tag. This workflow is the
# public half -- it rebuilds the installer from exactly the tagged commit with the same
# scripts the local build uses, and publishes it, with the release_notes.py entry as the
# body. If it ever fails, the local releases\ shelf still has the shipping file.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Tag must name the package version
        run: |
          $v = (uv run python -c "import mt5copier; print(mt5copier.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "tag is ${{ github.ref_name }} but __version__ is $v"
          }
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: Inno Setup, if the runner image lacks it
        run: |
          $found = (Get-Command iscc -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup -y --no-progress }

      - name: Build the installer
        run: powershell -ExecutionPolicy Bypass -File scripts\build_installer.ps1 -Rebuild

      - name: Write the release body from release_notes.py
        run: uv run python scripts/release_body.py "${{ github.ref_name }}" body.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/mt5copier-setup-$env:VERSION.exe" `
            --title "mt5copier $env:VERSION" `
            --notes-file body.md
