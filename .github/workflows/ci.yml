# The same gate as scripts\check.ps1, run by GitHub on every pull request into master.
#
# The job is named "gate" on purpose: the master branch ruleset requires a passing check
# of exactly that name before a PR may merge. Windows runner because the app and two of
# its dependencies (metatrader5, pywebview) are win32-only; the tests are fakes-based and
# need no terminal installed.

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Run the check gate
        run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1
